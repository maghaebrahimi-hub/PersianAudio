name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Optimize long document audio chunks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/persianaudio/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          s = s.replace('splitByLength(seg.text, 650)', 'splitByLength(seg.text, 1400)')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PersianAudioTranslator-v2.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersianAudioTranslator-v2.2
          path: PersianAudioTranslator-v2.2.apk
